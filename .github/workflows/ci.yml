name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: Swatinem/rust-cache@v2

      - name: Build library (no features)
        run: cargo build

      - name: Test (CLI + all backends)
        run: |
          mkdir -p test_outputs smoke_test_outputs
          cargo ci-test


  # `typst-math` and `typst` are opt-in and excluded from `full`, so the main
  # test job above compiles their tests out entirely. This job is the only
  # thing covering the typst tiers — without it they would rot silently.
  typst:
    name: Test (opt-in typst tiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: Swatinem/rust-cache@v2

      - name: Test (typst math tier + markup backend)
        run: |
          mkdir -p test_outputs smoke_test_outputs
          cargo ci-test-typst

      - name: Clippy (typst math tier + markup backend)
        run: cargo ci-clippy-typst


  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (CLI + all backends)
        run: cargo ci-clippy

      # Lint the feature-gated dioxus backend too (cli,full excludes it).
      - name: Clippy (dioxus backend)
        run: cargo clippy --all-targets --no-default-features --features dioxus -- -D warnings

  wasm:
    name: WASM (dioxus backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Guards the native Dioxus `Scene -> Element` backend: it must keep
      # compiling for the browser target with only the `dioxus` feature.
      - name: Build dioxus backend for wasm32-unknown-unknown
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features dioxus

      # The `dioxus` feature must never drag a native-only dep into the wasm
      # lib build (these are gated behind png/pdf/cli/parquet/typst, not dioxus).
      - name: Assert no native-dep leak into the wasm build
        run: |
          leak=$(cargo tree --target wasm32-unknown-unknown --no-default-features --features dioxus --edges normal \
            | grep -iE 'fontdue|png|flate2|svg2pdf|krilla|usvg|typst|clap|arrow' || true)
          if [ -n "$leak" ]; then
            echo "Native dep leaked into the wasm dioxus build:"; echo "$leak"; exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo ci-fmt

  msrv:
    name: MSRV build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build library (no features) at MSRV
        run: cargo +${{ steps.msrv.outputs.version }} build

      # Excludes `pdf`: krilla (the pdf feature's backend) and typst (its
      # math typesetter) need a newer Rust than package.rust-version —
      # verified separately by the pdf-msrv job below, at its own higher floor.
      - name: Build library (CLI + non-PDF backends) at MSRV
        run: cargo +${{ steps.msrv.outputs.version }} build --features cli,png,embed_font

  pdf-msrv:
    name: PDF feature MSRV build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read PDF feature's MSRV from Cargo.toml
        id: pdf_msrv
        run: echo "version=$(sed -n 's/^pdf_feature = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install PDF feature's MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pdf_msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # `full` = png + pdf + embed_font. Adding `typst-math` here matches what
      # the release workflow's pre-built binaries use (features:
      # cli,full,typst-math), so verify that whole combination builds cleanly
      # at the pdf feature's own real MSRV floor rather than
      # package.rust-version (which no longer covers it). `typst-math` has a
      # lower floor of its own (typst 0.14 needs 1.89 < krilla's 1.92), so
      # building it here covers both.
      - name: Build library (CLI + all backends + typst math) at pdf's MSRV
        run: cargo +${{ steps.pdf_msrv.outputs.version }} build --features cli,full,typst-math
